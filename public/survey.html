<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Shoppers' Website Survey</title>

<link href="style.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
  
<body>

<div class="survey-hero text-center text-white py-5">
    <h1>Shoppers Website UI Survey</h1>
    <p class="lead">Help us understand how users experience the Shoppers Drug Mart website.</p>
</div>

<div class="container my-5">

<div class="card shadow-lg survey-card">

<div class="card-body p-5">

<!-- Progress Bar -->
<div class="progress mb-4">
  <div id="progressBar" class="progress-bar bg-danger" style="width:33%"></div>
</div>

<form id="myform">

<!-- STEP 1 -->
<div class="form-step active-step">

<h4 class="mb-4">Website Usage</h4>

<p>
Visit the website:
<a href="https://www.shoppersdrugmart.ca/" target="_blank">
Shoppers Drug Mart
</a>
</p>

<img src="shoppers.png" class="img-fluid survey-image mb-4">

<div class="mb-4">
<label class="form-label fw-semibold">
What feature do you use most often?
</label>
<input type="text" class="form-control" id="most_used">
</div>

<div class="mb-4">
<label class="form-label fw-semibold">
What UI change would improve the website?
</label>
<input type="text" class="form-control" id="ui_change">
</div>

<div class="text-end">
<button type="button" class="btn btn-danger next-btn">
Next →
</button>
</div>

</div>

<!-- STEP 2 -->
<div class="form-step">

<h4 class="mb-4">Visual Design</h4>

<label class="form-label fw-semibold">
How visually appealing is the website?
</label>

<div class="survey-options">

<div class="form-check">
<input class="form-check-input" type="radio" name="appealing" value="Very appealing">
<label class="form-check-label">Very appealing</label>
</div>

<div class="form-check">
<input class="form-check-input" type="radio" name="appealing" value="Appealing">
<label class="form-check-label">Appealing</label>
</div>

<div class="form-check">
<input class="form-check-input" type="radio" name="appealing" value="Neutral">
<label class="form-check-label">Neutral</label>
</div>

<div class="form-check">
<input class="form-check-input" type="radio" name="appealing" value="Unappealing">
<label class="form-check-label">Unappealing</label>
</div>

</div>

<div class="mt-4">

<label class="form-label fw-semibold">
How long did it take to find a product?
</label>

<select class="form-select" id="time">

<option value="">Select</option>
<option>Less than 1 minute</option>
<option>1 – 3 minutes</option>
<option>3 – 5 minutes</option>
<option>More than 5 minutes</option>
<option>Could not find it</option>

</select>

</div>

<div class="d-flex justify-content-between mt-4">

<button type="button" class="btn btn-outline-secondary prev-btn">
← Back
</button>

<button type="button" class="btn btn-danger next-btn">
Next →
</button>

</div>

</div>

<!-- STEP 3 -->
<div class="form-step">

<h4 class="mb-4">Website Features</h4>

<label class="form-label fw-semibold">
Which UI elements work well?
</label>

<div class="survey-options">

<div class="form-check">
<input class="form-check-input" type="checkbox" value="navigation">
<label class="form-check-label">Navigation menu</label>
</div>

<div class="form-check">
<input class="form-check-input" type="checkbox" value="search">
<label class="form-check-label">Search bar</label>
</div>

<div class="form-check">
<input class="form-check-input" type="checkbox" value="filters">
<label class="form-check-label">Product filters</label>
</div>

<div class="form-check">
<input class="form-check-input" type="checkbox" value="layout">
<label class="form-check-label">Page layout</label>
</div>

<div class="form-check">
<input class="form-check-input" type="checkbox" value="readability">
<label class="form-check-label">Text readability</label>
</div>

<div class="form-check">
<input class="form-check-input" type="checkbox" value="checkout">
<label class="form-check-label">Checkout process</label>
</div>

</div>

<div class="mt-4">

<label class="form-label fw-semibold">
Additional feedback
</label>

<textarea class="form-control" rows="4"></textarea>

</div>

<div class="d-flex justify-content-between mt-4">

<button type="button" class="btn btn-outline-secondary prev-btn">
← Back
</button>

<button id="submitButton" type="button" class="submit-btn">
Submit Survey
</button>

</div>

</div>

</form>

</div>
</div>

<p class="text-center text-muted mt-4">
Site created by Group 4 - Kiara, Sabirin and Jeny
</p>

</div>

<script src="script.js"></script>

</body>

</html>
